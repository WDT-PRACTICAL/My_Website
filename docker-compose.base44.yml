services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "--watch", "server.js"]
    volumes:
      - ./api:/app
    environment:
      - PORT=4000
    expose:
      - "4000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null && wget -qO- http://127.0.0.1/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
