<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="styles/products.css">
    <link rel="stylesheet" href="styles/catalog.css">
</head>
<body>
    <header>
        <h1>Our Laptops</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <figure class="catalog-cover">
            <img src="https://media.base44.com/images/public/6aba9890bc06830fa7fa9dac/44f57f410_generated_13072796.png"
                 alt="MSI gaming laptop lit on a dark surface">
            <figcaption>Featured machine &middot; MSI Gaming</figcaption>
        </figure>

        <section class="catalog" id="catalog">
            <div class="catalog-head">
                <span>No.</span>
                <span>Model</span>
                <span>Notes</span>
                <span>Price</span>
            </div>
            <p class="status" id="status">Loading products&hellip;</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 ShopEasy. All rights reserved.</p>
    </footer>

    <script>
        const catalog = document.getElementById('catalog');
        const statusElement = document.getElementById('status');

        const priceFormatter = new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 0
        });

        function stars(rating) {
            return '★'.repeat(rating) + '☆'.repeat(Math.max(0, 5 - rating));
        }

        function catalogRow(product, index) {
            const row = document.createElement('article');
            row.className = 'catalog-row';
            row.innerHTML = `
                <a href="${product.page}">
                    <span class="row-index">${String(index + 1).padStart(2, '0')}</span>
                    <span class="row-name">${product.name}</span>
                    <span class="row-spec">${product.description}
                        <span class="row-rating">${stars(product.rating)}</span>
                    </span>
                    <span class="row-price">${priceFormatter.format(product.price)}</span>
                </a>`;
            row.querySelector('a').style.animationDelay = `${index * 70}ms`;
            return row;
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                if (!response.ok) {
                    throw new Error(`API responded with ${response.status}`);
                }
                const { products } = await response.json();

                statusElement.remove();
                products.forEach((product, index) => catalog.appendChild(catalogRow(product, index)));
            } catch (error) {
                statusElement.textContent = 'Sorry, products could not be loaded right now.';
                statusElement.classList.add('status--error');
            }
        }

        loadProducts();
    </script>
</body>
</html>
